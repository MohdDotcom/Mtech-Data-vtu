
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mtech Data - Add Money</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
    padding: 20px;
}

.container {
    max-width: 450px;
    margin: 30px auto;
    background: white;
    padding: 24px;
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.06);
}

.header {
    margin-bottom: 25px;
}

.header h2 {
    color: #2563eb;
    margin-bottom: 8px;
}

.header p {
    color: #64748b;
    font-size: 14px;
}

.amount-box {
    margin: 20px 0;
}

.amount-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}

.amount-box input {
    width: 100%;
    padding: 16px;
    font-size: 22px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
}

.amount-box input:focus {
    border-color: #2563eb;
}

.presets {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 15px 0;
}

.presets button {
    padding: 13px;
    border: 1px solid #cbd5e1;
    background: white;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

.presets button:hover {
    background: #eff6ff;
    border-color: #2563eb;
}

.summary {
    background: #f8fafc;
    padding: 16px;
    border-radius: 10px;
    margin: 20px 0;
}

.summary p {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 8px;
}

.summary h3 {
    font-size: 25px;
    color: #0f172a;
}

.pay-button {
    width: 100%;
    padding: 16px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.pay-button:hover {
    background: #1d4ed8;
}

.back-button {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #2563eb;
    text-decoration: none;
}

.notice {
    background: #fff7ed;
    color: #9a3412;
    padding: 12px;
    border-radius: 9px;
    font-size: 13px;
    margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Mtech Data</h2>
        <p>Add money to your wallet</p>
    </div>

    <div class="amount-box">
        <label for="amount">Enter Amount (₦)</label>
        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="100"
            max="100000"
        >
    </div>

    <div class="presets">
        <button onclick="setAmount(500)">₦500</button>
        <button onclick="setAmount(1000)">₦1,000</button>
        <button onclick="setAmount(2000)">₦2,000</button>
        <button onclick="setAmount(5000)">₦5,000</button>
        <button onclick="setAmount(10000)">₦10,000</button>
        <button onclick="setAmount(20000)">₦20,000</button>
    </div>

    <div class="summary">
        <p>Amount to add</p>
        <h3 id="displayAmount">₦0.00</h3>
    </div>

    <button class="pay-button" onclick="continuePayment()">
        Continue to Payment
    </button>

    <div class="notice">
        Payment integration is not yet connected.
        No money will be charged.
    </div>

    <a href="login.html" class="back-button">
        Back to Dashboard
    </a>

</div>

<script>
const amountInput = document.getElementById("amount");
const displayAmount = document.getElementById("displayAmount");

function setAmount(value) {
    amountInput.value = value;
    updateAmount();
}

function updateAmount() {
    const amount = Number(amountInput.value || 0);

    displayAmount.textContent = amount.toLocaleString("en-NG", {
        style: "currency",
        currency: "NGN"
    });
}

amountInput.addEventListener("input", updateAmount);

function continuePayment() {
    const amount = Number(amountInput.value);

    if (!amount || amount < 100) {
        alert("Minimum wallet funding amount is ₦100.");
        return;
    }

    if (amount > 100000) {
        alert("Maximum wallet funding amount is ₦100,000.");
        return;
    }

    alert(
        "Add Money page is working!\\n\\n" +
        "Amount selected: ₦" + amount.toLocaleString("en-NG") +
        "\\n\\nPaystack will be connected in the next step."
    );
}
</script>

</body>
</html>
