<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mtech Data - Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    padding: 20px;
}

.container {
    max-width: 400px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #ddd;
}

.logo {
    text-align: center;
    color: #0066cc;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    margin-bottom: 25px;
    color: #666;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 14px;
    background: #0066cc;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.password-row {
    display: flex;
    gap: 5px;
}

.password-row input {
    flex: 1;
    min-width: 0;
}

.eye-button {
    width: auto;
    padding: 10px;
    margin-bottom: 15px;
}

.forgot {
    text-align: right;
    margin: 0 0 15px;
}

.forgot a,
.switch a {
    color: #0066cc;
    cursor: pointer;
    font-weight: bold;
}

.switch {
    text-align: center;
    margin-top: 20px;
}

#dashboard {
    display: none;
}

.services {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 25px;
}

.service {
    background: #eaf3ff;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    color: #0066cc;
}

.logout {
    background: #dc2626;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">MTECH DATA</div>

    <p class="subtitle">
        Airtime, Data and Bill Payment
    </p>

    <div id="auth">

        <h2 id="formTitle">Create Account</h2>

        <form id="authForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <div class="password-row">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="eye-button"
                    onclick="togglePassword()"
                >👁️</button>

            </div>

            <p class="forgot" id="forgotBox" style="display:none;">
                <a onclick="forgotPassword()">Forgot Password?</a>
            </p>

            <button type="submit" id="submitBtn">
                Register
            </button>

        </form>

        <p class="switch" id="switchText">
            Already have an account?
            <a onclick="toggleForm()">Login</a>
        </p>

    </div>

    <div id="dashboard">

        <h2 id="welcomeText">Welcome to Mtech Data!</h2>

        <p style="text-align:center;">
            Your VTU dashboard
        </p>

        <div class="services">

            <div class="service">📱 Airtime</div>

            <div class="service">📶 Data</div>

            <div class="service">💰 Wallet</div>

            <div class="service">📄 Transactions</div>

        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

</div>

<!-- Firebase Libraries -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

// FIREBASE CONFIGURATION

const firebaseConfig = {
    apiKey: "AIzaSyCtkn6CR7c6W25T8ZCfB4Pksq-zYCsSrFI",
    authDomain: "mtech-data-127a1.firebaseapp.com",
    projectId: "mtech-data-127a1",
    storageBucket: "mtech-data-127a1.firebasestorage.app",
    messagingSenderId: "776924403550",
    appId: "1:776924403550:web:d89a50d7a1dac5d858a1cf",
    measurementId: "G-XCBQ04VSWM"
};

// INITIALIZE FIREBASE

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

let isRegister = true;


// SWITCH BETWEEN REGISTER AND LOGIN

function toggleForm() {

    isRegister = !isRegister;

    const nameField = document.getElementById("name");

    const passwordField = document.getElementById("password");

    document.getElementById("formTitle").innerText =
        isRegister ? "Create Account" : "Login";

    document.getElementById("submitBtn").innerText =
        isRegister ? "Register" : "Login";

    nameField.style.display =
        isRegister ? "block" : "none";

    nameField.required = isRegister;

    passwordField.value = "";

    document.getElementById("forgotBox").style.display =
        isRegister ? "none" : "block";

    document.getElementById("switchText").innerHTML =
        isRegister
        ? 'Already have an account? <a onclick="toggleForm()">Login</a>'
        : 'New customer? <a onclick="toggleForm()">Register</a>';

}


// SHOW OR HIDE PASSWORD

function togglePassword() {

    const passwordField = document.getElementById("password");

    if (passwordField.type === "password") {

        passwordField.type = "text";

    } else {

        passwordField.type = "password";

    }

}


// REGISTER AND LOGIN

document.getElementById("authForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();

    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value;

    try {

        if (isRegister) {

            const result = await auth.createUserWithEmailAndPassword(
                email,
                password
            );

            await result.user.updateProfile({
                displayName: name
            });

            alert("Welcome to Mtech Data! Your account has been created.");

        } else {

            await auth.signInWithEmailAndPassword(
                email,
                password
            );

            alert("Login successful!");

        }

    } catch (error) {

        alert("Error: " + error.message);

    }

});


// FORGOT PASSWORD

async function forgotPassword() {

    const email = document.getElementById("email").value.trim();

    if (!email) {

        alert("Please enter your email address first.");

        return;

    }

    try {

        await auth.sendPasswordResetEmail(email);

        alert("Password reset email sent. Please check your inbox.");

    } catch (error) {

        alert("Error: " + error.message);

    }

}


// SHOW CUSTOMER DASHBOARD

auth.onAuthStateChanged(function(user) {

    if (user) {

        document.getElementById("auth").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

        document.getElementById("welcomeText").innerText =
            "Welcome " + (user.displayName || user.email);

    } else {

        document.getElementById("auth").style.display = "block";

        document.getElementById("dashboard").style.display = "none";

    }

});


// LOGOUT

function logout() {

    auth.signOut()
    .catch(function(error) {

        alert("Logout error: " + error.message);

    });

}

</script>

</body>
</html>
